name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tools and dependencies
        run: python -m pip install --upgrade build setuptools-scm && python -m pip install -e .[dev]

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run ty
        run: ty check --python "$(python -c 'import sys; print(sys.prefix)')"

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Build package
        if: matrix.python-version == '3.12'
        run: rm -rf dist build src/*.egg-info && python -m build

      - name: Smoke-test wheel
        if: matrix.python-version == '3.12'
        run: python -m pip install --force-reinstall --no-deps dist/*.whl && python -c "import obsidian_publish_confluence"

      - name: Upload distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
