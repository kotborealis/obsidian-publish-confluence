name: publish

on:
  release:
    types:
      - published

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build setuptools-scm

      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          RELEASE_TAG="$RELEASE_TAG" python - <<'PY'
          import os
          import setuptools_scm

          expected = os.environ["RELEASE_TAG"][1:]
          actual = setuptools_scm.get_version()
          if actual != expected:
              raise SystemExit(f"Package version {actual} does not match tag {expected}")
          PY

      - name: Build package
        run: rm -rf dist build src/*.egg-info && python -m build

      - name: Verify built distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          test -f "dist/obsidian_publish_confluence-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "dist/obsidian_publish_confluence-${RELEASE_VERSION}.tar.gz"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
